[workspace]
resolver = "3"
members = [
    "crates/onto-core",
    "crates/onto-intelli",
    "crates/onto-grpc",
    "crates/onto-cli",
    "crates/onto-ffi",
]
default-members = ["crates/onto-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/f8fvwgzc/onto-intelli"
homepage = "https://github.com/f8fvwgzc/onto-intelli"
keywords = ["ontology", "knowledge-graph", "llm", "grpc", "agents"]
categories = ["database", "network-programming"]

[workspace.dependencies]
onto-core = { path = "crates/onto-core", version = "0.2.0", default-features = false }
onto-intelli = { path = "crates/onto-intelli", version = "0.2.0", default-features = false }
onto-grpc = { path = "crates/onto-grpc", version = "0.2.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
toml = "0.9"
fastrand = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-std", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
bytes = "1"

clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Smallest, fastest binaries for published releases: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
