[workspace]
resolver = "3"
members = [
    "crates/onto-core",
    "crates/onto-intelli",
    "crates/onto-grpc",
    "crates/onto-control",
    "crates/onto-cli",
    "crates/onto-ffi",
    "crates/onto-bench",
    "crates/onto-cert",
]
default-members = ["crates/onto-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/f8fvwgzc/onto-intelli"
homepage = "https://github.com/f8fvwgzc/onto-intelli"
keywords = ["ontology", "knowledge-graph", "llm", "grpc", "agents"]
categories = ["database", "network-programming"]

[workspace.dependencies]
onto-core = { path = "crates/onto-core", version = "0.2.0", default-features = false }
onto-intelli = { path = "crates/onto-intelli", version = "0.2.0", default-features = false }
onto-grpc = { path = "crates/onto-grpc", version = "0.2.0" }
onto-control = { path = "crates/onto-control", version = "0.2.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
toml = "0.9"
fastrand = "2"
regex-lite = "0.1"
# Only `HashTable`: hash tables that store values without a separate key.
hashbrown = { version = "0.15", default-features = false }
# PostgreSQL through sqlx's core and driver crates: the types of `sqlx` 0.9
# (an application's `sqlx::PgPool` is a `sqlx_postgres::PgPool`), without
# the facade's other drivers.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-aws-lc-rs", "json"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
# Read-only metadata connectors (onto-intelli's mysql, sqlserver and mongodb features).
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["json"] }
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls-aws-lc"] }
# The driver's bson 3, with its extended-JSON conversions.
bson = { version = "3.1", default-features = false, features = ["compat-3-0-0", "serde_json-1"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-std", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
# RSS and Atom feeds (onto-intelli signals).
quick-xml = "0.41"

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.4"
# AES-256-GCM, signature verification, SHA-256, HMAC and a CSPRNG for the
# control plane: the same build of AWS-LC that rustls already uses.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
bytes = "1"

clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Smallest, fastest binaries for published releases: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
