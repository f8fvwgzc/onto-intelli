[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-intelli"
version = "0.2.0"
description = "Client for onto-intelli: ask questions of your ontology, run actions, read traces. Standard library only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["ontology", "knowledge-graph", "llm", "agents", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/f8fvwgzc/onto-intelli"

[tool.setuptools]
packages = ["onto_intelli"]

[tool.setuptools.package-data]
onto_intelli = ["py.typed"]
