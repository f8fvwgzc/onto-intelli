[package]
name = "onto-core"
description = "Ontology core for onto-intelli: schema, typed graph, provenance, events, policy, inference rules and dependency analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["postgres"]
# Durable storage: PostgreSQL 16+ with pgvector, shared by any number of
# processes (LISTEN/NOTIFY). Without it only the in-memory store is built.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres", "dep:tokio", "dep:futures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
toml.workspace = true
fastrand.workspace = true
regex-lite.workspace = true
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
