[package]
name = "onto-control"
description = "Control plane for onto-intelli: organizations, members, projects as tenants, API keys, console sessions, OpenID Connect sign-in and per-project LLM providers with encrypted keys, budgets and usage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
onto-core = { workspace = true, features = ["postgres"] }
onto-intelli = { workspace = true, features = ["postgres", "http-llm"] }
aws-lc-rs.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
