// onto-intelli built-in API.
//
// The server does not use generated stubs: every RPC below is mapped onto an
// engine action at runtime, exactly like user-supplied protos configured in
// onto-intelli.toml. Field names match the engine's JSON (proto3 JSON mapping
// with original field names), and free-form results use google.protobuf.Struct.
syntax = "proto3";

package onto_intelli.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// ───────────────────────────── Things ─────────────────────────────

message Provenance {
  string source = 1;              // upload | github | ai_generation | saas | manual | ingest
  repeated string derived_from = 2;
  string generated_by = 3;
  string run = 4;
  string external_ref = 5;
  int64 at = 6;
}

message Entity {
  string id = 1;                  // kind:key, e.g. issue:421
  string kind = 2;
  string workspace = 3;
  string title = 4;
  string state = 5;
  google.protobuf.Struct props = 6;
  repeated string aliases = 7;
  Provenance provenance = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  uint64 revision = 11;
}

message LinkSpec {
  string rel = 1;
  string to = 2;
  google.protobuf.Struct props = 3;
}

message EntityInput {
  string id = 1;
  string kind = 2;
  string key = 3;
  string workspace = 4;
  string title = 5;
  string state = 6;
  google.protobuf.Struct props = 7;
  repeated string aliases = 8;
  Provenance provenance = 9;
  bool replace = 10;
  repeated LinkSpec links = 11;
  bool fill_only = 12;            // only fill empty fields of an existing entity
}

message EntityPatch {
  string id = 1;
  string title = 2;
  string state = 3;
  google.protobuf.Struct props = 4;
  repeated string unset = 5;
}

message EntityRef {
  string id = 1;
}

message DeleteResult {
  string id = 1;
  bool deleted = 2;
  uint64 revision = 3;
}

message Related {
  string rel = 1;
  string to = 2;
}

message FindRequest {
  string kind = 1;
  string workspace = 2;
  repeated string state = 3;
  optional bool open = 4;
  google.protobuf.Struct props = 5;
  Related related = 6;
  string within = 7;
  uint32 limit = 8;
  uint32 offset = 9;
}

message EntityList {
  repeated Entity entities = 1;
  uint64 total = 2;
}

message SearchRequest {
  string query = 1;
  repeated string kinds = 2;
  string workspace = 3;
  uint32 limit = 4;
}

message SearchHit {
  Entity entity = 1;
  float score = 2;
}

message SearchResult {
  repeated SearchHit hits = 1;
}

message LinkInput {
  string from = 1;
  string rel = 2;                 // canonical or inverse name (owned_by)
  string to = 3;
  google.protobuf.Struct props = 4;
}

message LinkResult {
  string from = 1;
  string rel = 2;
  string to = 3;
  uint64 revision = 4;
  bool changed = 5;
  bool deleted = 6;
}

message ApplyRequest {
  repeated google.protobuf.Struct mutations = 1;   // {"op": "upsert" | "patch" | "delete" | "link" | "unlink" | "event", ...}
  string workspace = 2;
}

message MutationResult {
  uint64 applied = 1;
  repeated string entities = 2;
  uint64 links = 3;
  repeated string events = 4;
  uint64 revision = 5;
}

message NeighborsRequest {
  string id = 1;
  string rel = 2;
}

message Neighbor {
  string rel = 1;
  Entity entity = 2;
}

message NeighborsResult {
  repeated Neighbor neighbors = 1;
}

message TraverseRequest {
  repeated string start = 1;
  repeated string rels = 2;
  string direction = 3;           // out | in | both
  uint32 depth = 4;
  uint32 limit = 5;
  repeated string kinds = 6;
}

message Edge {
  string from = 1;
  string rel = 2;
  string to = 3;
}

message Subgraph {
  repeated Entity nodes = 1;
  repeated Edge edges = 2;
  bool truncated = 3;
}

message PathRequest {
  string from = 1;
  string to = 2;
  uint32 depth = 3;
}

message PathResult {
  bool found = 1;
  string text = 2;
  repeated Edge hops = 3;
}

service OntologyService {
  rpc UpsertEntity(EntityInput) returns (Entity);
  rpc PatchEntity(EntityPatch) returns (Entity);
  rpc GetEntity(EntityRef) returns (Entity);
  rpc DeleteEntity(EntityRef) returns (DeleteResult);
  rpc FindEntities(FindRequest) returns (EntityList);
  rpc Search(SearchRequest) returns (SearchResult);
  rpc CreateLink(LinkInput) returns (LinkResult);
  rpc DeleteLink(LinkInput) returns (LinkResult);
  rpc Apply(ApplyRequest) returns (MutationResult);
  rpc Neighbors(NeighborsRequest) returns (NeighborsResult);
  rpc Traverse(TraverseRequest) returns (Subgraph);
  rpc Path(PathRequest) returns (PathResult);
}

// ─────────────────────────── Intelligence ───────────────────────────

message AskRequest {
  string question = 1;
  string workspace = 2;
  string conversation_id = 3;     // "new" starts a conversation; empty = one-off
  string mode = 4;                // auto | deterministic | llm
  uint32 token_budget = 5;
  bool include_context = 6;
  bool no_cache = 7;
  bool confirm = 8;               // apply commands instead of proposing them
  google.protobuf.Struct trace = 9;   // {session_id, user_id, tags, metadata, name} of the trace
}

message ResolvedEntity {
  string id = 1;
  string kind = 2;
  string title = 3;
  string mention = 4;
  float confidence = 5;
}

message TokenUsage {
  uint64 prompt_tokens = 1;
  uint64 completion_tokens = 2;
  uint64 cached_tokens = 3;
  double cost_usd = 4;
  bool estimated = 5;
}

message Efficiency {
  uint64 context_tokens = 1;
  uint64 naive_tokens = 2;
  uint64 saved_tokens = 3;
  uint64 facts_used = 4;
  uint64 facts_dropped = 5;
}

message Timings {
  double resolve_ms = 1;
  double retrieve_ms = 2;
  double llm_ms = 3;
  double total_ms = 4;
}

message AskResponse {
  string answer = 1;
  string mode = 2;                // deterministic | llm | llm_cache | answer_cache | fallback
  string intent = 3;
  bool why = 4;
  repeated ResolvedEntity entities = 5;
  repeated string facts = 6;
  string conversation_id = 7;
  TokenUsage usage = 8;
  Efficiency efficiency = 9;
  Timings timings = 10;
  string provider = 11;
  string model = 12;
  string request_id = 13;
  uint64 revision = 14;
  repeated string memories = 15;
  google.protobuf.Struct context = 16;
  string note = 17;
  repeated ResolvedEntity options = 18;   // candidates when mode = clarify
  google.protobuf.Struct action = 19;     // receipt when mode = proposal | action
  string trace_id = 20;                   // the trace that recorded this answer
}

message AskEvent {
  string type = 1;                // stage | entities | delta | done | error
  string text = 2;
  google.protobuf.Value data = 3;
}

message ContextRequest {
  string question = 1;
  string workspace = 2;
  uint32 token_budget = 3;
}

message GraphQuery {
  string id = 1;
  string direction = 2;           // upstream | downstream (Dependencies)
  uint32 depth = 3;
  string workspace = 4;           // Cycles
}

service IntelliService {
  rpc Ask(AskRequest) returns (AskResponse);
  rpc AskStream(AskRequest) returns (stream AskEvent);
  rpc BuildContext(ContextRequest) returns (google.protobuf.Struct);
  rpc Infer(GraphQuery) returns (google.protobuf.Struct);
  rpc Dependencies(GraphQuery) returns (google.protobuf.Struct);
  rpc Impact(GraphQuery) returns (google.protobuf.Struct);
  rpc RootCause(GraphQuery) returns (google.protobuf.Struct);
  rpc CriticalPath(GraphQuery) returns (google.protobuf.Struct);
  rpc Cycles(GraphQuery) returns (google.protobuf.Struct);
}

// ──────────────────────── Governed actions ────────────────────────

message ActionRequest {
  string action = 1;              // action type, e.g. assign, set_state, block
  google.protobuf.Struct params = 2;
  string workspace = 3;
  bool confirm = 4;               // required for high-risk or irreversible actions
  bool dry_run = 5;
  bool consequences = 6;          // Plan: also report the derived facts the edits change
}

message UndoRequest {
  string receipt = 1;
  bool force = 2;                 // undo even if touched entities changed since
  string workspace = 3;
}

// Action types are declared in the schema: typed parameters, preconditions,
// effects, risk. Plan previews edits and reversibility; Apply writes them with
// an audit event and an undo receipt in one transaction.
service ActionService {
  rpc List(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Plan(ActionRequest) returns (google.protobuf.Struct);
  rpc Apply(ActionRequest) returns (google.protobuf.Struct);
  rpc Undo(UndoRequest) returns (google.protobuf.Struct);
  rpc Receipt(EntityRef) returns (google.protobuf.Struct);
}

// ─────────────────── Analytics, time and data quality ───────────────────
// Requests and responses are JSON objects; fields match the engine actions
// (`onto actions`): metric.query, entity.history, graph.changes, ...

service AnalyticsService {
  rpc Metric(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Metrics(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Derived(EntityRef) returns (google.protobuf.Struct);
  rpc History(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc AsOf(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Changes(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Quality(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Duplicates(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Merge(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Scenario(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Experts(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Profile(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SuggestSchema(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Export(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Eval(google.protobuf.Struct) returns (google.protobuf.Struct);
}

// ───────────────────────────── Memory ─────────────────────────────

message RememberRequest {
  string text = 1;
  repeated string entities = 2;
  string kind = 3;                // fact | preference | summary
  bool private = 4;
  string workspace = 5;
  float salience = 6;
}

message MemoryItem {
  string id = 1;
  string workspace = 2;
  string scope = 3;               // episodic | long_term
  string kind = 4;
  string text = 5;
  repeated string entities = 6;
  string subject = 7;
  string conversation = 8;
  float salience = 9;
  uint32 hits = 10;
  int64 created_at = 11;
  int64 last_access = 12;
  int64 expires_at = 13;
  bool consolidated = 14;
}

message RecallRequest {
  string query = 1;
  repeated string entities = 2;
  string workspace = 3;
  uint32 k = 4;
}

message MemoryHit {
  MemoryItem item = 1;
  float score = 2;
}

message RecallResult {
  repeated MemoryHit items = 1;
}

service MemoryService {
  rpc Remember(RememberRequest) returns (MemoryItem);
  rpc Recall(RecallRequest) returns (RecallResult);
  rpc Consolidate(google.protobuf.Empty) returns (google.protobuf.Struct);
}

// ───────────────────────────── Events ─────────────────────────────

message EventInput {
  string action = 1;              // e.g. file.upload, deployment.run
  string actor = 2;
  string target = 3;
  string workspace = 4;
  string outcome = 5;             // success | failure | denied | pending
  string intent = 6;
  string source = 7;
  repeated string derived_from = 8;
  google.protobuf.Value payload = 9;
  int64 ts = 10;
}

message Event {
  string id = 1;
  int64 ts = 2;
  string workspace = 3;
  string actor = 4;
  string action = 5;
  string target = 6;
  string request_id = 7;
  string outcome = 8;
  string intent = 9;
  string source = 10;
  repeated string derived_from = 11;
  google.protobuf.Value payload = 12;
}

message EventFilter {
  string workspace = 1;
  string actor = 2;
  string target = 3;
  string action = 4;              // exact or dotted prefix
  int64 since = 5;
  int64 until = 6;
  uint32 limit = 7;
}

message EventList {
  repeated Event events = 1;
}

message IngestSummary {
  uint64 accepted = 1;
  bool queued = 2;
  MutationResult result = 3;
}

service EventService {
  rpc Append(EventInput) returns (Event);
  rpc List(EventFilter) returns (EventList);
  // Stream mutations, bare entities or GitHub webhook payloads; applied atomically at the end.
  rpc Ingest(stream google.protobuf.Struct) returns (IngestSummary);
}

// ───────────────────────────── Admin ─────────────────────────────

message HealthStatus {
  string status = 1;
  string version = 2;
  uint64 revision = 3;
  string llm = 4;
  bool llm_available = 5;
}

// ──────────────────────── Live schema ────────────────────────

// A schema change set. Each change is an object with an `op` and its fields:
// put_object_type {name, def, migrations?} · delete_object_type {name, migrations?} ·
// rename_object_type {from, to} · put_property {object_type, name, def, migrations?} ·
// delete_property {object_type, name, migrations?} · rename_property {object_type, from, to} ·
// put_link_type {name, def, migrations?} · delete_link_type {name, migrations?} ·
// rename_link_type {from, to} · put_interface/put_action_type/put_metric {name, def} ·
// put_rule {def} · delete_* {name} · put_glossary_term {section, word, target} ·
// delete_glossary_term {section, word} · set_analysis {def}.
// Migrations: {action: delete_entities|retype|map_states|set_default|convert|drop_values|
// delete_links|move_links|keep_latest|acknowledge, ...}.
message SchemaChangeRequest {
  repeated google.protobuf.Struct changes = 1;
  string message = 2;
  uint64 expected_version = 3;    // 0: whatever version is active
  repeated google.protobuf.Struct migrations = 4;
  bool dry_run = 5;               // Apply only: return the plan
  string workspace = 6;           // where the schema.change audit event is recorded
}

message SchemaVersionRequest {
  uint64 version = 1;             // Get: 0 = active
}

message SchemaHistoryRequest {
  uint32 limit = 1;
}

message SchemaAsOfRequest {
  int64 ts = 1;                   // unix ms
  double days_ago = 2;
}

message SchemaDiffRequest {
  uint64 from = 1;
  uint64 to = 2;                  // 0 = active
}

message SchemaRevertRequest {
  uint64 version = 1;
  repeated google.protobuf.Struct migrations = 2;
  bool dry_run = 3;
  string workspace = 4;
}

// A schema change proposal: anyone allowed to propose (agents included)
// files it; approvers (never agents, never the proposer) approve or reject.
message ProposeRequest {
  string title = 1;
  string rationale = 2;
  repeated google.protobuf.Struct changes = 3;
  repeated google.protobuf.Struct migrations = 4;
  string message = 5;
  string source = 6;              // e.g. "nexc-assistant"
  string workspace = 7;
}

message ListProposalsRequest {
  string status = 1;              // open | applied | rejected | failed | withdrawn; empty = all
  uint32 limit = 2;
}

message ProposalRef {
  string id = 1;
  string workspace = 2;
}

message ReviewRequest {
  string id = 1;
  string comment = 2;
  uint64 seen_version = 3;        // schema version previewed; 0 = do not check
  string workspace = 4;
}

message ReviseRequest {
  string id = 1;
  string title = 2;
  string rationale = 3;
  repeated google.protobuf.Struct changes = 4;
  repeated google.protobuf.Struct migrations = 5;
  string message = 6;
  string workspace = 7;
}

// Object types, properties, link types, interfaces, action types, rules,
// metrics and glossary terms as data: validated, previewed (impact and
// migration), versioned, audited and reversible; or proposed and reviewed.
service SchemaService {
  rpc Get(SchemaVersionRequest) returns (google.protobuf.Struct);
  rpc Status(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Plan(SchemaChangeRequest) returns (google.protobuf.Struct);
  rpc Apply(SchemaChangeRequest) returns (google.protobuf.Struct);
  rpc History(SchemaHistoryRequest) returns (google.protobuf.Struct);
  rpc Version(SchemaVersionRequest) returns (google.protobuf.Struct);
  rpc AsOf(SchemaAsOfRequest) returns (google.protobuf.Struct);
  rpc Diff(SchemaDiffRequest) returns (google.protobuf.Struct);
  rpc Revert(SchemaRevertRequest) returns (google.protobuf.Struct);
  rpc Undo(SchemaRevertRequest) returns (google.protobuf.Struct);
  rpc Propose(ProposeRequest) returns (google.protobuf.Struct);
  rpc ListProposals(ListProposalsRequest) returns (google.protobuf.Struct);
  rpc GetProposal(ProposalRef) returns (google.protobuf.Struct);
  rpc Approve(ReviewRequest) returns (google.protobuf.Struct);
  rpc Reject(ReviewRequest) returns (google.protobuf.Struct);
  rpc Comment(ReviewRequest) returns (google.protobuf.Struct);
  rpc Withdraw(ProposalRef) returns (google.protobuf.Struct);
  rpc Revise(ReviseRequest) returns (google.protobuf.Struct);
}

// ──────────────────────── nexc execution vocabulary ────────────────────────
// Needs ontology.extend = ["builtin:nexc-execution"]. Shapes match nexc-engine's
// NodeType / RelationType: {key, label, description, color, icon, default_role,
// default_executor, stage, produces_artifact, allow_code_exec} and
// {key, label, description, blocking}.

message GraphRef {
  string graph = 1;               // key (g1) or id (execution_graph:g1)
}

message GraphsRequest {
  string workspace = 1;
  uint32 limit = 2;
}

message VocabularyRequest {
  string graph = 1;
  repeated google.protobuf.Struct node_types = 2;
  repeated google.protobuf.Struct relation_types = 3;
  string workspace = 4;
}

message InitGraphRequest {
  string graph = 1;
  string title = 2;
  bool empty = 3;                 // true: no starter vocabulary
  repeated google.protobuf.Struct node_types = 4;
  repeated google.protobuf.Struct relation_types = 5;
  string workspace = 6;
}

service ExecutionService {
  rpc Graphs(GraphsRequest) returns (google.protobuf.Struct);
  rpc Vocabulary(GraphRef) returns (google.protobuf.Struct);
  rpc SetVocabulary(VocabularyRequest) returns (google.protobuf.Struct);
  rpc InitGraph(InitGraphRequest) returns (google.protobuf.Struct);
}

// ── Data catalog: connectors, OntoRank, learned facts ───────────────────────

message ConnectRequest {
  string name = 1;                // [a-z0-9_-], part of entity ids
  string kind = 2;                // postgres (default)
  string url = 3;                 // postgres://… or env:VAR (preferred)
  string workspace = 4;
  repeated string schemas = 5;    // * wildcards; empty: all
  repeated string exclude_schemas = 6;
  uint64 every_secs = 7;          // background crawl interval (default 900)
  bool map_grants = 8;            // table grants become entity ACLs
  map<string, string> grant_map = 9;   // database role -> onto principal or team
  map<string, string> owner_map = 10;  // database role -> owning team or person
  uint32 max_queries = 11;
  string title = 12;
}

message ConnectorRef {
  string name = 1;                // crawl: empty crawls every connector
  bool purge = 2;                 // disconnect: also delete what it crawled
}

message TermRequest {
  string term = 1;
  string workspace = 2;
  uint32 limit = 3;
}

message JoinRequest {
  string from = 1;
  string to = 2;
}

message RankRequest {
  string id = 1;
}

message TopRequest {
  repeated string kinds = 1;
  string workspace = 2;
  uint32 limit = 3;
}

message LearnedRequest {
  string fact_type = 1;           // join_path | metric | synonym
  string state = 2;               // suggested | certified | rejected
  string about = 3;               // entity id
  uint32 limit = 4;
}

message DecideFactRequest {
  string id = 1;
  string note = 2;
}

service CatalogService {
  rpc AddConnector(ConnectRequest) returns (google.protobuf.Struct);
  rpc ListConnectors(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc RemoveConnector(ConnectorRef) returns (google.protobuf.Struct);
  rpc Crawl(ConnectorRef) returns (google.protobuf.Struct);
  rpc FindData(TermRequest) returns (google.protobuf.Struct);
  rpc JoinPath(JoinRequest) returns (google.protobuf.Struct);
  rpc TrustedMetric(TermRequest) returns (google.protobuf.Struct);
  rpc Rank(RankRequest) returns (google.protobuf.Struct);
  rpc Top(TopRequest) returns (google.protobuf.Struct);
  rpc Rerank(TopRequest) returns (google.protobuf.Struct);
  rpc LearnedFacts(LearnedRequest) returns (google.protobuf.Struct);
  rpc Learn(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Certify(DecideFactRequest) returns (google.protobuf.Struct);
  rpc Reject(DecideFactRequest) returns (google.protobuf.Struct);
}

message CallRequest {
  string action = 1;              // any engine action, see Actions
  google.protobuf.Struct input = 2;
}

message CallResponse {
  google.protobuf.Value output = 1;
}

service AdminService {
  rpc Health(google.protobuf.Empty) returns (HealthStatus);
  rpc Stats(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Schema(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Actions(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Call(CallRequest) returns (CallResponse);
}

// ── Ontology builder: object, link and action types from a data source ──────
// A draft is deterministic (tables → object types, foreign keys and join
// tables → link types, edits → action types, each with its reason); the
// LLM refines it and answers modeling questions; people apply it, agents
// propose it. Proto3 drops false values, hence the negative flags.

message DraftRequest {
  string source = 1;              // connector name; empty: the only crawled source
  repeated string tables = 2;     // schema.table names or globs (sales.*); empty: all
  repeated string exclude = 3;    // globs to leave out; empty: staging.*, *_tmp, *_old, *_bak, *_backup
  bool no_default_exclude = 4;    // exclude only what `exclude` lists
  string prefix = 5;              // put before every object type name
  bool no_sync = 6;               // do not materialize rows as objects
  bool no_actions = 7;            // no action types
  bool views = 8;                 // model views too
  string instructions = 9;        // RefineOntology: what the model should pay attention to
  string workspace = 10;
}

message AdviseRequest {
  string question = 1;
  string source = 2;              // empty: the source the question names, or the only one
}

message ApplyDraftRequest {
  string source = 1;
  repeated string tables = 2;
  repeated string exclude = 3;
  bool no_default_exclude = 4;
  string prefix = 5;
  bool no_sync = 6;
  bool no_actions = 7;
  bool views = 8;
  google.protobuf.Struct draft = 9;   // a reviewed draft; drafted afresh when absent
  bool propose = 10;              // file a proposal instead of applying (agents must)
  string title = 11;
  string rationale = 12;
  bool no_crawl = 13;             // do not crawl the source after applying
  string workspace = 14;
  bool preview = 15;              // apply nothing: return the draft with its change set rebuilt
  string proposal_source = 16;    // where a proposal comes from; ontology.apply_draft by default
}

service OntologyBuilderService {
  rpc DraftOntology(DraftRequest) returns (google.protobuf.Struct);
  rpc RefineOntology(DraftRequest) returns (google.protobuf.Struct);
  rpc AdviseOntology(AdviseRequest) returns (google.protobuf.Struct);
  rpc ApplyDraft(ApplyDraftRequest) returns (google.protobuf.Struct);
}

// ── Object Explorer ──────────────────────────────────────────────────────

message ObjectTypesRequest {
  string workspace = 1;
}

message ExploreRequest {
  string kind = 1;                // object type or interface
  string workspace = 2;
  string search = 3;
  repeated google.protobuf.Struct filters = 4;  // {prop, op: eq|ne|in|gt|gte|lt|lte|contains|exists|missing, value}
  string sort = 5;                // prop ascending, -prop descending; _title, _state, _created_at, ... always name object fields
  uint32 limit = 6;               // default 50, at most 1000
  uint32 offset = 7;
  repeated string facets = 8;     // empty: automatic
  repeated string stats = 9;      // empty: automatic
}

service ObjectService {
  rpc ObjectTypes(ObjectTypesRequest) returns (google.protobuf.Struct);
  rpc Explore(ExploreRequest) returns (google.protobuf.Struct);
}

// ── Observability: traces, sessions, metrics, scores ─────────────────────
// Langfuse-style traces of asks, governed actions and LLM-using calls.
// Reading needs a principal that may observe (console members, an
// admin-scope API key, operator tokens). Responses are the JSON of the
// trace.* actions (docs/CONTROL_PLANE.md section 9).

service ObservabilityService {
  rpc ListTraces(google.protobuf.Struct) returns (google.protobuf.Struct);   // trace.list
  rpc GetTrace(EntityRef) returns (google.protobuf.Struct);                   // trace.get
  rpc Metrics(google.protobuf.Struct) returns (google.protobuf.Struct);      // trace.metrics
  rpc ListSessions(google.protobuf.Struct) returns (google.protobuf.Struct); // trace.sessions
  rpc GetSession(EntityRef) returns (google.protobuf.Struct);                 // trace.session
  rpc Score(google.protobuf.Struct) returns (google.protobuf.Struct);        // trace.score
}

// ── Assurance: reasoning, certificates, shapes, lint, locks, packs ───────
// One RPC per assurance action (`onto actions`); request field names are the
// actions' JSON keys and responses are their JSON. Derived facts are the
// engine's opinion: only the `check` of Certify and the CheckCertificate
// response carry a verdict, and it comes from the independent onto-cert
// checker. Empty strings and zero numbers mean "not given" (defaults apply).

message ReasonRunRequest {
  string workspace = 1;           // only this workspace's entities (schema facts always)
  uint64 max_derived = 2;         // stop after this many derived facts (default 1000000)
  uint32 samples = 3;             // sample derivations listed (default 20)
}

message ReasonQueryRequest {
  google.protobuf.ListValue pattern = 1;  // [[s, p, o], ...] with ?variables
  string workspace = 2;
  uint32 limit = 3;               // default 50
}

message ReasonFactRequest {
  google.protobuf.Value fact = 1; // [s, p, o] or {subject, relation, object}
  string workspace = 2;
  uint32 max = 3;                 // Explain: justifications listed (default 10)
  string semiring = 4;            // Provenance: why (default) | trust | count
}

message ReasonScopeRequest {
  string workspace = 1;
}

message CertificateFiles {
  string rules_tsv = 1;
  string asserted_tsv = 2;
  string derivations_tsv = 3;
  string manifest_json = 4;       // empty: no manifest, the digest check is skipped
}

message BindingRequest {
  string asserted_tsv = 1;
  string manifest_json = 2;
}

message VerifyRequest {
  repeated google.protobuf.Struct claims = 1;  // {subject, relation, object, rule?, premises?}
  string workspace = 2;
}

message SliceRequest {
  repeated string entities = 1;
  repeated google.protobuf.Struct goals = 2;   // claims the slice must preserve
  string workspace = 3;
  uint32 limit = 4;               // lost facts listed (default 100)
}

message ShapesValidateRequest {
  repeated string shapes = 1;     // empty: every shape
  string workspace = 2;
  bool inferred = 3;              // also read derived classes and relations
  uint32 limit = 4;               // results listed (default 1000; all are counted)
}

message ShapesInduceRequest {
  string kind = 1;
  string workspace = 2;
  string name = 3;                // default <kind>_shape
}

message ShapesCheckRequest {
  google.protobuf.Struct shapes = 1;   // {name: Shape}
}

message LintRequest {
  repeated string checks = 1;     // empty: every check
  bool include_dismissed = 2;
}

message LintFeedbackRequest {
  string id = 1;                  // finding id (12 hex digits)
  string decision = 2;            // accept | dismiss
  string note = 3;
  string workspace = 4;
}

message LockRequest {
  string section = 1;             // object_types | link_types | interfaces | rules | metrics | action_types | shapes | properties
  string name = 2;                // properties: kind.prop
  string reason = 3;
}

message AlignRequest {
  string pack = 1;                // a pack id, or
  string toml = 2;                // a schema TOML document
  double threshold = 3;           // minimum candidate score (default 0.5)
}

message AlignCertifyRequest {
  string pack = 1;
  string toml = 2;
  repeated google.protobuf.Struct mappings = 3;  // {source, target, predicate}
}

message PackRef {
  string id = 1;
}

message PackInstallRequest {
  string id = 1;
  string mode = 2;                // apply (default) | propose; agents always propose
  bool sample = 3;                // load the pack's sample data (its schema must be in force)
  string workspace = 4;
  string message = 5;
}

message SheetRequest {
  string csv = 1;                 // the CSV text (header row first)
  string kind = 2;
  string key = 3;
  string workspace = 4;
  string file = 5;                // file name, used for the kind name
}

message SheetIngestRequest {
  string csv = 1;
  google.protobuf.Struct mapping = 2;  // empty: induced from the sheet
  string kind = 3;
  string key = 4;
  string workspace = 5;
  bool dry_run = 6;
  string file = 7;
}

service AssuranceService {
  rpc Run(ReasonRunRequest) returns (google.protobuf.Struct);                 // reason.run
  rpc Query(ReasonQueryRequest) returns (google.protobuf.Struct);             // reason.query
  rpc Explain(ReasonFactRequest) returns (google.protobuf.Struct);            // reason.explain
  rpc Provenance(ReasonFactRequest) returns (google.protobuf.Struct);         // reason.provenance
  rpc Certify(ReasonScopeRequest) returns (google.protobuf.Struct);           // reason.certify
  rpc CheckCertificate(CertificateFiles) returns (google.protobuf.Struct);    // reason.check_certificate
  rpc Binding(BindingRequest) returns (google.protobuf.Struct);               // reason.binding
  rpc Verify(VerifyRequest) returns (google.protobuf.Struct);                 // reason.verify
  rpc SliceCheck(SliceRequest) returns (google.protobuf.Struct);              // reason.slice_check
  rpc ValidateShapes(ShapesValidateRequest) returns (google.protobuf.Struct); // shapes.validate
  rpc InduceShape(ShapesInduceRequest) returns (google.protobuf.Struct);      // shapes.induce
  rpc CheckShapes(ShapesCheckRequest) returns (google.protobuf.Struct);       // shapes.check
  rpc Lint(LintRequest) returns (google.protobuf.Struct);                     // schema.lint
  rpc LintFeedback(LintFeedbackRequest) returns (google.protobuf.Struct);     // schema.lint_feedback
  rpc Locks(google.protobuf.Empty) returns (google.protobuf.Struct);          // schema.locks
  rpc Lock(LockRequest) returns (google.protobuf.Struct);                     // schema.lock
  rpc Unlock(LockRequest) returns (google.protobuf.Struct);                   // schema.unlock
  rpc Align(AlignRequest) returns (google.protobuf.Struct);                   // schema.align
  rpc AlignCertify(AlignCertifyRequest) returns (google.protobuf.Struct);     // schema.align_certify
  rpc ListPacks(google.protobuf.Empty) returns (google.protobuf.Struct);      // pack.list
  rpc ShowPack(PackRef) returns (google.protobuf.Struct);                     // pack.show
  rpc PlanPack(PackRef) returns (google.protobuf.Struct);                     // pack.plan
  rpc InstallPack(PackInstallRequest) returns (google.protobuf.Struct);       // pack.install
  rpc InduceSheet(SheetRequest) returns (google.protobuf.Struct);             // model.induce
  rpc IngestSheet(SheetIngestRequest) returns (google.protobuf.Struct);       // ingest.sheet
}

// ── Change feed: what each commit changed, filtered per reader ───────────
// Unary in this version: Poll reads one page after a cursor, Head says where
// the feed is, Capture switches recording for the tenant (admins of every
// workspace). Responses are the JSON of changes.poll, changes.head and
// changes.capture. Proto3 drops false values, hence exclude_migrations and
// off. Delivery is at least once; exactly once is not offered.

message ChangesPollRequest {
  string after = 1;               // a previous page's next ("42.0"); empty: see from
  string from = 2;                // without after: earliest (default) | now
  uint32 limit = 3;               // records scanned (default [changes] page, at most 1000)
  repeated string kinds = 4;      // entity kinds or interfaces (links match through either end)
  repeated string ops = 5;        // entity.create | entity.update | entity.delete | entity.hidden | link.* | schema.change | gap
  repeated string workspaces = 6;
  repeated string ids = 7;        // at most 1000
  repeated string rels = 8;       // link records only
  repeated string props = 9;      // updates that changed any of these fields
  repeated string sources = 10;   // globs on the writer's source; !x excludes
  string fields = 11;             // full (default) | ids
  bool exclude_migrations = 12;   // leave out records written by schema migrations
}

message ChangesCaptureRequest {
  bool on = 1;                    // record changes
  bool off = 2;                   // stop recording (proto3 drops on = false)
  string workspace = 3;           // workspace of the audit event
}

service ChangeService {
  rpc Poll(ChangesPollRequest) returns (google.protobuf.Struct);        // changes.poll
  rpc Head(google.protobuf.Empty) returns (google.protobuf.Struct);     // changes.head
  rpc Capture(ChangesCaptureRequest) returns (google.protobuf.Struct);  // changes.capture
}

// ── Webhooks: signed CloudEvents to registered endpoints ─────────────────
// Endpoints receive CloudEvents 1.0 (structured JSON) signed the Standard
// Webhooks way (webhook-id, webhook-timestamp, webhook-signature). An
// endpoint sees what its principal may read. With a filter it subscribes to
// the change feed: each change is enqueued once per endpoint and delivered at
// least once; receivers dedupe on the event id. Admins only, never agents,
// and the caller must dominate the endpoint's principal. Responses are the
// JSON of the webhook.* and outbox.list actions. Proto3 drops false values,
// hence disabled, clear_filter, exclude_migrations and off.

message WebhookFilter {
  repeated string kinds = 1;      // entity kinds or interfaces (links match through either end)
  repeated string ops = 2;        // entity.create | entity.update | entity.delete | entity.hidden | link.* | schema.change | gap
  repeated string workspaces = 3;
  repeated string ids = 4;
  repeated string rels = 5;
  repeated string props = 6;
  repeated string sources = 7;
  string fields = 8;              // full (default) | ids
  bool exclude_migrations = 9;
}

message WebhookPrincipal {
  repeated string roles = 1;      // what the receiver may see: viewer, member, admin or custom roles
  repeated string workspaces = 2; // a subset of the caller's
}

message WebhookAddRequest {
  string name = 1;                // [a-z0-9_-], at most 40; principal id webhook:<name>
  string url = 2;                 // https (or an operator env:/file: reference)
  string secret = 3;              // empty: a whsec_ secret is generated, sealed and returned once
  WebhookFilter filter = 4;       // set: subscribe to the change feed from now on
  WebhookPrincipal principal = 5; // default: viewer in the call's workspace
  bool disabled = 6;
  string workspace = 7;           // workspace of the audit event
}

message WebhookUpdateRequest {
  string name = 1;
  string url = 2;
  string secret = 3;
  WebhookFilter filter = 4;
  bool clear_filter = 5;          // drop the change subscription
  WebhookPrincipal principal = 6;
  bool enabled = 7;
  bool disabled = 8;
  string workspace = 9;
}

message WebhookNameRequest {
  string name = 1;
  string workspace = 2;
}

message WebhookRotateRequest {
  string name = 1;
  string secret = 2;              // empty: generated and returned once
  uint64 keep_secs = 3;           // the previous secret also signs this long (default a day)
  string workspace = 4;
}

message WebhookDeliveriesRequest {
  string name = 1;
  string id = 2;                  // one delivery with its attempts
  repeated string states = 3;     // pending | inflight | retry | delivered | dead | cancelled
  int64 since = 4;                // created at or after (Unix ms)
  uint32 limit = 5;
}

message WebhookReplayRequest {
  string name = 1;
  repeated string ids = 2;
  int64 since = 3;
  repeated string states = 4;     // default: retry, delivered, dead, cancelled
  string workspace = 5;
}

message WebhookKillRequest {
  bool on = 1;                    // hold every delivery in the outbox
  bool off = 2;                   // resume deliveries
  string workspace = 3;
}

message OutboxListRequest {
  string target = 1;
  repeated string states = 2;
  string source = 3;              // change | action | automation | test
  string receipt = 4;
  string run = 5;
  int64 since = 6;
  uint32 limit = 7;
}

service WebhookService {
  rpc Add(WebhookAddRequest) returns (google.protobuf.Struct);                // webhook.add
  rpc Update(WebhookUpdateRequest) returns (google.protobuf.Struct);          // webhook.update
  rpc Remove(WebhookNameRequest) returns (google.protobuf.Struct);            // webhook.remove
  rpc List(google.protobuf.Empty) returns (google.protobuf.Struct);           // webhook.list
  rpc Test(WebhookNameRequest) returns (google.protobuf.Struct);              // webhook.test
  rpc RotateSecret(WebhookRotateRequest) returns (google.protobuf.Struct);    // webhook.rotate_secret
  rpc Deliveries(WebhookDeliveriesRequest) returns (google.protobuf.Struct);  // webhook.deliveries
  rpc Replay(WebhookReplayRequest) returns (google.protobuf.Struct);          // webhook.replay
  rpc Resume(WebhookNameRequest) returns (google.protobuf.Struct);            // webhook.resume
  rpc Kill(WebhookKillRequest) returns (google.protobuf.Struct);              // webhook.kill
  rpc Outbox(OutboxListRequest) returns (google.protobuf.Struct);             // outbox.list
}
