[package]
name = "onto-bench"
description = "Load benchmark: a synthetic enterprise graph on PostgreSQL, timed queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["count-alloc"]
# A counting global allocator for the heap rows of the report. Only this
# binary links it; onto-core and onto-intelli never do.
count-alloc = []

[dependencies]
onto-intelli = { workspace = true, features = ["postgres", "outbound"] }
tokio.workspace = true
serde_json.workspace = true
clap.workspace = true
fastrand.workspace = true
