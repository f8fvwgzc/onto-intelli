[package]
name = "onto-intelli"
description = "Enterprise Execution Intelligence on an ontology: context graphs, dependency reasoning, episodic and long-term memory, token-budgeted LLM orchestration and caching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["postgres", "http-llm", "outbound", "mysql", "sqlserver", "mongodb"]
# Durable storage: PostgreSQL 16+ with pgvector (the only durable backend).
postgres = ["onto-core/postgres"]
# Read-only metadata connectors for other databases (the catalog and the ontology builder).
mysql = ["onto-core/postgres", "dep:sqlx-mysql"]
sqlserver = ["dep:tiberius", "dep:tokio-util"]
mongodb = ["dep:mongodb", "dep:bson"]
# OpenAI-compatible (OpenAI, Ollama, vLLM, LM Studio, OpenRouter) and Anthropic providers.
http-llm = ["dep:reqwest", "outbound"]
# Outbound HTTP the engine sends itself: the guarded client (SSRF rules) and
# signed webhook deliveries from the outbox.
outbound = ["dep:reqwest", "dep:hmac"]

[dependencies]
onto-core.workspace = true
# The independent certificate checker (std, sha2 and serde_json only): reason.certify
# and reason.check_certificate report its verdict, never the engine's.
onto-cert = { path = "../onto-cert", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
toml.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
url.workspace = true
quick-xml.workspace = true
hmac = { workspace = true, optional = true }
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }
sqlx-mysql = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# A local webhook receiver for the delivery tests.
axum.workspace = true
