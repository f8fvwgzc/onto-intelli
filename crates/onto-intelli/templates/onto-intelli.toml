# onto-intelli configuration. Relative paths resolve against this file's folder.
# Every section is optional; omitted values use the defaults shown here.

[engine]
storage = "postgres"          # postgres (PostgreSQL 16+ with pgvector) | memory (volatile: tests, demos)
# The database URL holds credentials: keep it in the environment.
# Order: --database-url, database_url here, ONTO_DATABASE_URL, DATABASE_URL.
# `make db-up` starts a local one: postgres://onto:onto@127.0.0.1:5441/onto
# database_url = "postgres://user:pass@host/db?sslmode=require"
default_workspace = "acme"
ingest_queue = 1024           # async ingestion backpressure
# read_consistency = "eventual" # eventual | strong (check the database's commit head before each read)
# follow_interval_ms = 1000     # poll fallback when a LISTEN/NOTIFY notice is missed
# PostgreSQL tenants open on first use and close again (they reopen on the next request):
# max_open_tenants = 512        # least recently used close past this (0: no limit)
# tenant_idle_secs = 1800       # unused this long (0: never)
# tenant_memory_budget_mb = 0   # least recently used close while the open ones' estimate is above it (0: none)
# One process per deployment (elected) opens closed tenants whose background work is due; `onto serve` stands:
# wake_poll_secs = 20           # its fallback poll when no wake notice arrives (0: this process never scans)

# [engine.postgres]
# tenant = "acme"               # one PostgreSQL schema per tenant: {schema_prefix}{tenant}
# schema_prefix = "onto_"
# max_connections = 10
# connect_timeout_secs = 10

[ontology]
schema = "builtin:enterprise" # or a path to your own schema TOML
extend = ["builtin:data-catalog", "builtin:code"] # layers: data sources, tables, columns, queries, learned facts; packages, dependencies, owners; add e.g. "schema/custom.toml"
strict = false                # true: reject unknown kinds/relations/properties
schema_mode = "live"          # live: stored versions win, file edits import as new versions | config: files win

# Who may change the schema through the API (see docs/SCHEMA.md).
[governance]
apply_roles = ["admin"]       # apply change sets directly
approve_roles = ["admin"]     # approve/reject proposals (agents never can)
required_approvals = 1
allow_self_approval = false
agent_raw_writes = false      # true: agents may also write the graph directly (entity.upsert, graph.apply, ...)

# Connectors crawl data sources' metadata (never rows) into the catalog:
#   onto connect postgres env:WAREHOUSE_URL --name warehouse --every 15m
# They are stored in the database; this only controls the background crawler.
[connectors]
background = true             # crawl due connectors while onto runs
tick_secs = 30

[llm]
# Keys set here win over the platform's LLM_* variables (LLM connection contract v1,
# docs/EMBEDDING.md); keys left unset take them, else the defaults shown.
# mock: offline and deterministic (default, no key needed)
# openai | ollama | openai-compatible (vLLM, LM Studio, OpenRouter) | anthropic | none
# provider = "mock"
# model = ""                  # empty = provider default
# api_key_env = "OPENAI_API_KEY"      # keys are read from the environment only
# api_key_file = "/var/run/secrets/llm/api-key"  # or a file, read on every request
# base_url = "http://localhost:11434/v1"
# max_retries = 0             # retries after a transport error, 408, 429 or 5xx (0..=10)
max_output_tokens = 4096
# effort = "medium"           # anthropic: low | medium | high | xhigh | max
# fallbacks = true            # anthropic: server-side refusal fallback
timeout_secs = 120
# [llm.pricing]               # USD per million tokens, for cost tracking
# input_per_mtok = 4.0
# output_per_mtok = 20.0
# cached_input_per_mtok = 0.2

[context]
token_budget = 1800           # max tokens of facts sent to the LLM per question
max_depth = 2                 # graph hops expanded around resolved entities
max_nodes = 80
history_turns = 6             # verbatim turns; older ones fold into a summary
recent_events = 5
knowledge_hits = 4

[cache]
enabled = true
max_entries = 10000
answer_ttl_secs = 300         # keys include the graph revision: writes invalidate
llm_ttl_secs = 86400
persist_llm = true

[memory]
enabled = true
recall_k = 4
episodic_ttl_days = 30
consolidate_after = 3         # repeated episodes about the same things -> long-term memory
consolidate_every = 25
recall_budget_tokens = 600    # recalled memories on the ask path (0 = unlimited)
merge_threshold = 0.85        # a repeat at this similarity merges into the existing fact
supersede_threshold = 0.5     # token overlap at which a changed fact replaces the old one
superseded_ttl_days = 180     # history kept for as-of recall (0 = forever)
prune_below = 0.4             # consolidated, never-recalled episodes fade out (~14 days)
max_episodes_per_subject = 2000
max_summaries_per_subject = 200

[reasoning]
# Intents answered straight from the graph (zero LLM tokens) when entities resolve.
deterministic_intents = ["lookup", "owner", "assignee", "status", "members", "count", "list",
                         "blockers", "dependencies", "impact", "relation", "workload", "history",
                         "expert", "metric", "changes", "quality", "what_if",
                         "data_location", "join_path", "trusted_metric", "model"]
min_confidence = 0.8

[grpc]
listen = "127.0.0.1:50051"
builtin_api = true            # onto_intelli.v1.* services
reflection = true             # grpcurl / Postman discovery
health = true                 # grpc.health.v1
http = true                   # JSON on the same port: POST /v1/call/{action}, /v1/ask
proto_dirs = ["protos"]
proto_files = ["acme/tickets/v1/tickets.proto"]

# Map RPCs of your own protos onto engine actions (`onto actions` lists them).
# Templates read the request with {{field.path}}; a value that is exactly one
# placeholder keeps its JSON type. Fields whose placeholders are missing are dropped.

[[grpc.routes]]
method = "acme.tickets.v1.TicketService/CreateTicket"
action = "entity.upsert"
[grpc.routes.request]
kind = "issue"
key = "{{ticket_id}}"
title = "{{title}}"
state = "open"
props = { priority = "{{priority}}" }
links = [
  { rel = "belongs_to", to = "project:{{project}}" },
  { rel = "assigned_to", to = "person:{{assignee}}" },
]
[grpc.routes.response]
id = "{{id}}"
title = "{{title}}"
state = "{{state}}"
priority = "{{props.priority}}"

[[grpc.routes]]
method = "acme.tickets.v1.TicketService/GetTicket"
action = "entity.get"
request = { id = "issue:{{ticket_id}}" }
response = { id = "{{id}}", title = "{{title}}", state = "{{state}}", priority = "{{props.priority}}" }

[[grpc.routes]]
method = "acme.tickets.v1.TicketService/Ask"
action = "intelli.ask"
request = { question = "{{question}}" }
response = { text = "{{answer}}", facts = "{{facts}}", mode = "{{mode}}" }

[mcp]
allow_writes = false          # `onto mcp`: expose apply_action/undo_action to agents
# Tool profile: full (every tool) | catalog | authoring | reasoning | governance | retrieval | evaluation.
# ask, search, get_entity and get_schema are in every profile. ONTO_MCP_PROFILE overrides this,
# and `onto mcp --profile <name>` overrides both; an unknown name refuses to start.
profile = "full"
# MCP clients act as an agent: they read, propose schema changes, never apply or approve them.
principal = { id = "mcp-agent", roles = ["agent"], workspaces = ["*"] }

[auth]
mode = "token"                # token (default) | dev: no authentication, loopback only (or `onto serve --dev`)
# The operator token: export ONTO_TOKEN=$(openssl rand -hex 24)
[[auth.tokens]]
token_env = "ONTO_TOKEN"
principal = { id = "operator", roles = ["admin"], workspaces = ["*"] }
# An agent with its own token:
# [[auth.tokens]]
# token_env = "ONTO_TOKEN_OPS"
# principal = { id = "ops-bot", roles = ["agent"], workspaces = ["acme"], entity = "agent:ops-bot" }
# A trusted service acting for its own users (x-onto-act-as / -roles / -workspaces / -entity
# headers name each call's principal, so per-user roles and ACLs apply):
# [[auth.tokens]]
# token_env = "NEXC_ONTO_TOKEN"
# principal = { id = "nexc-backend", roles = ["member"], workspaces = ["*"] }
# impersonate = true
# impersonate_roles = ["viewer", "member", "agent", "approver"]
# tenants = ["*"]

# The CLI and in-process (FFI) callers open the store directly and act as:
[local]
principal = { id = "local", roles = ["admin"], workspaces = ["*"] }

# The control plane (docs/CONTROL_PLANE.md): organizations, members, projects
# (each project is a tenant), API keys and console sign-in, kept in a
# control store next to the tenants.
[console]
# Serve the console routes (/v1/console/...). Requires engine.tenancy = "multi"
# (startup fails otherwise) and at least one sign-in path: an [[console.oidc]]
# provider, the bootstrap token, or dev mode.
enabled = false
# Public base URL of this server: invitation links, and the OIDC redirect URI
# {public_url}/v1/console/auth/oidc/callback. https:// unless the host is loopback.
public_url = "http://127.0.0.1:50051"
# PostgreSQL schema of the control store (in memory when engine.storage = "memory").
schema = "onto_control"
# First sign-in through an IdP creates the user. When false, only invited
# users (by verified email) and existing users can sign in.
allow_signup = true
# A new user with no membership gets an organization of their own.
create_org_on_signup = true
# Verified email domains allowed to sign up; empty = any.
allowed_email_domains = []
# Environment variable with a bootstrap admin token (at least 32 characters):
# POST /v1/console/auth/token signs in as the local administrator.
# export ONTO_ADMIN_TOKEN=$(openssl rand -hex 32)
bootstrap_token_env = "ONTO_ADMIN_TOKEN"
# Console session lifetime (refreshed by the UI while the tab is open).
session_ttl_secs = 28800
# Allow project LLM base URLs, and the git and PostgreSQL URLs of connectors
# that API keys and console sessions register, to resolve to loopback or
# private addresses (self-hosted Ollama, an internal git server or database);
# also lets those credentials register ssh:// and user@host:path git URLs.
allow_private_urls = false
# Projects per organization (0 = unlimited).
max_projects_per_org = 20
# API keys are stored as SHA-256(pepper || key): set ONTO_KEY_PEPPER (at least
# 32 characters) or ONTO_MASTER_KEY (32 bytes, base64 or hex), or keys cannot
# be created.

# Sign-in through an OpenID Connect provider (Clerk, Auth0, Supabase Auth,
# Google, Keycloak, Okta, Entra):
# [[console.oidc]]
# id = "clerk"                                   # [a-z0-9-], used in URLs
# name = "Clerk"                                 # shown on the sign-in button
# issuer = "https://example.clerk.accounts.dev"
# client_id = "..."
# client_secret_env = "ONTO_OIDC_CLERK_SECRET"   # omit for a public client (PKCE only)
# scopes = ["openid", "email", "profile"]
# audiences = []                                 # extra accepted `aud` values besides client_id

# Traces of the engine's work (docs/CONTROL_PLANE.md section 9): each ask,
# governed action and LLM-using call with its spans and token counts, kept in
# the tenant's store and read with trace.* actions, /v1/traces and /v1/metrics.
[traces]
enabled = true
retention_days = 30                # per project: the trace_retention_days setting, 1..400
# Store question, prompt and answer text (clipped). false: metadata only.
capture_content = true
max_content_bytes = 4096
# Which engine calls become traces besides intelli.ask: "writes" (writing
# actions and LLM-using actions), "all", or "none".
calls = "writes"
# Background writer: flush every this many ms or records.
flush_ms = 500
flush_records = 200
queue = 10000                      # records waiting; beyond this they are dropped and counted

# The change feed (changes.poll, changes.head, GET|POST /v1/changes/stream):
# records of what each commit changed, filtered per reader. Whether commits
# record changes is a tenant property, switched with the changes.capture action
# (admins of every workspace).
[changes]
retain_days = 7                    # change records older than this are removed hourly, whole commits (0: no age limit)
retain_max_rows = 5000000          # and at most this many are kept per tenant (0: no count limit)
page = 500                         # records scanned per changes.poll or stream page without a limit (1..1000)
ring = 4096                        # records per tenant in memory, only while it has streams (counted in the memory budget)
eval_budget_ms = 50                # filtering time per stream page before the page is split
heartbeat_secs = 15                # streams send the last cursor scanned this often
stall_timeout_secs = 60            # a client that reads nothing this long is cut (slow_consumer)
max_backfill_seqs = 100000         # commits behind the head before a stream ends too_far_behind
reauth_secs = 60                   # streams re-authenticate their request this often
max_subscribers = 200              # streams per tenant per process
max_subscribers_per_principal = 20
max_subscribers_process = 2000

# Webhook delivery from the outbox (docs/design/EVENTS.md Part B): signed
# CloudEvents (Standard Webhooks signatures). Each change is enqueued once per
# endpoint and delivered at least once; receivers dedupe on the event id.
# Delivery concurrency limits are per process.
[webhooks]
enabled = true                     # false: this process sends nothing (rows wait in the outbox)
max_endpoints = 50                 # per tenant
timeout_secs = 10
poll_secs = 20                     # fallback poll; commits that enqueue rows wake the worker at once
max_attempts = 15
backoff_base_secs = 10             # retry delay min(base * 2^(attempt-1), max) with jitter; Retry-After up to max
backoff_max_secs = 3600
max_payload_bytes = 262144         # larger bodies are not sent (dead: payload_too_large)
max_in_flight_per_endpoint = 4     # per process
max_in_flight_per_tenant = 8       # per process
max_in_flight_process = 64
pause_after_failures = 20          # consecutive failures pause an endpoint ...
pause_secs = 300                   # ... this long, then one probe (a failed probe doubles it, up to 1 h)
pending_cap = 100000
retain_days = 14                   # finished rows and attempt logs
# Operator rules: a host that may resolve into private CIDRs (never for
# endpoints a project registered; link-local and metadata ranges never).
# [[webhooks.allow]]
# host = "hooks.internal.example"  # or "*.internal.example"
# cidrs = ["10.20.0.0/16"]
