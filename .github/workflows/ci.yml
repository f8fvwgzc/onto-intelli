name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Everything, including the PostgreSQL integration tests and the
  # competency questions, against PostgreSQL 16 with pgvector.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onto
          POSTGRES_PASSWORD: onto
          POSTGRES_DB: onto
        ports: ["5432:5432"]
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U onto -d onto"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://onto:onto@localhost:5432/onto
      # Full debug info in every test binary fills the runner's disk (the
      # linker dies with SIGBUS); line tables keep backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Competency questions on PostgreSQL
        run: |
          cargo run -q --locked -p onto-intelli-cli -- init "$RUNNER_TEMP/eval"
          cargo run -q --locked -p onto-intelli-cli -- -c "$RUNNER_TEMP/eval/onto-intelli.toml" --tenant ci_eval seed demo
          cargo run -q --locked -p onto-intelli-cli -- -c "$RUNNER_TEMP/eval/onto-intelli.toml" --tenant ci_eval eval

  # The MySQL/MariaDB, SQL Server and MongoDB connectors against real servers.
  connectors:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: onto-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ponto-ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: onto-ci
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Onto-ci-Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Onto-ci-Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONTO_TEST_MYSQL_URL: mysql://root:onto-ci@127.0.0.1:3306/{db}
      ONTO_TEST_MARIADB_URL: mysql://root:onto-ci@127.0.0.1:3307/{db}
      ONTO_TEST_SQLSERVER_URL: sqlserver://sa:Onto-ci-Passw0rd@127.0.0.1:1433/{db}?trust_server_certificate=true
      ONTO_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/{db}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The connector tests, on every engine (none skipped)
        shell: bash
        run: |
          cargo test --locked -p onto-intelli --test connectors_dbs -- --nocapture 2>&1 | tee "$RUNNER_TEMP/out.txt"
          if grep -q "skipped:" "$RUNNER_TEMP/out.txt"; then exit 1; fi

  # The tests that need no database (PostgreSQL tests skip without DATABASE_URL).
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every test binary runs, so one failure does not hide the rest.
      - run: cargo test --workspace --locked --no-fail-fast

  # Advisories, licences, bans and sources (deny.toml), and the RustSec database again.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny --locked check
      - if: ${{ !cancelled() }}
        run: cargo audit

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint --strict deploy/helm/onto-intelli --set existingSecret=onto
      - name: Render, and refuse to render without a Secret
        run: |
          helm template onto deploy/helm/onto-intelli --set existingSecret=onto > /dev/null
          if helm template onto deploy/helm/onto-intelli > /dev/null 2>&1; then
            echo "rendered without existingSecret" >&2; exit 1
          fi
      - name: The LLM contract mounts no provider key in gateway mode
        run: |
          if helm template onto deploy/helm/onto-intelli --set existingSecret=onto | grep -q 'name: LLM_'; then
            echo "LLM_* without global.llm.enabled" >&2; exit 1
          fi
          out=$(helm template onto deploy/helm/onto-intelli --set existingSecret=onto \
            --set global.llm.enabled=true --set global.llm.gatewayUrl=https://gateway:8443 --set global.llm.model=m)
          grep -q 'key: gateway-token' <<<"$out"
          if grep -q 'api-key' <<<"$out"; then
            echo "a provider key is mounted in gateway mode" >&2; exit 1
          fi
          out=$(helm template onto deploy/helm/onto-intelli --set existingSecret=onto --set global.llm.enabled=true)
          grep -q 'key: api-key' <<<"$out" && grep -q 'name: llm-config' <<<"$out"
      - name: The process can read the mounted LLM credentials
        run: |
          # Secret files are root-owned with mode 0440: uid 10001 reads them only through
          # fsGroup, in the pod that mounts them (the Deployment).
          pod=$(helm template onto deploy/helm/onto-intelli --set existingSecret=onto --set global.llm.enabled=true \
            -s templates/deployment.yaml)
          grep -q 'secretName: llm-credentials' <<<"$pod" && grep -q 'defaultMode: 0440' <<<"$pod"
          grep -q 'fsGroup: 10001' <<<"$pod" || { echo "0440 Secret files without fsGroup" >&2; exit 1; }

  # The release image builds (linux/amd64 here; the release adds arm64) and carries git for the
  # repository connector.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: onto-intelli:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=max
      - name: onto and git run in the image
        run: |
          docker run --rm --entrypoint onto onto-intelli:ci --version
          docker run --rm --entrypoint git onto-intelli:ci --version
          test "$(docker run --rm --entrypoint id onto-intelli:ci -u)" = 10001

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: The committed build matches the sources
        run: git diff --exit-code -- crates/onto-grpc/ui-dist
