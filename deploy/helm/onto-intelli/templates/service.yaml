apiVersion: v1
kind: Service
metadata:
  name: {{ include "onto-intelli.fullname" . }}
  labels:
    {{- include "onto-intelli.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "onto-intelli.selectorLabels" . | nindent 4 }}
  ports:
    # gRPC (h2c), JSON over HTTP and the UI on one port.
    - name: grpc
      port: {{ .Values.port }}
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
